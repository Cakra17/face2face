<!DOCTYPE html>
<html>

<body>
  <video id="local" autoplay muted playsinline></video>
  <video id="remote" autoplay playsinline></video>
  <button onclick="start()">Join</button>

  <script>
    const ws = new WebSocket('ws://localhost:6969/api/v1/ws')
    const pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    })

    // pending ICE candidates queue
    const pendingCandidates = []
    let remoteDescSet = false

    // handle incoming messages from signaling server
    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data)

      switch (msg.type) {
        case 'offer':
          await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp })
          remoteDescSet = true

          // drain queued candidates
          for (const c of pendingCandidates) {
            await pc.addIceCandidate(c)
          }
          pendingCandidates.length = 0

          const answer = await pc.createAnswer()
          await pc.setLocalDescription(answer)
          ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }))
          break

        case 'answer':
          await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp })
          remoteDescSet = true

          for (const c of pendingCandidates) {
            await pc.addIceCandidate(c)
          }
          pendingCandidates.length = 0
          break

        case 'ice':
          if (!remoteDescSet) {
            pendingCandidates.push(msg.candidate)
          } else {
            await pc.addIceCandidate(msg.candidate)
          }
          break

        case 'peer_joined':
          console.log('peer joined:', msg.peer_id)
          break

        case 'peer_left':
          console.log('peer left:', msg.peer_id)
          break
      }
    }

    // send our ICE candidates to server
    pc.onicecandidate = (event) => {
      if (!event.candidate) return
      ws.send(JSON.stringify({ type: 'ice', candidate: event.candidate }))
    }

    // render incoming remote tracks
    pc.ontrack = (event) => {
      document.getElementById('remote').srcObject = event.streams[0]
    }

    async function start() {
      // tell server we're joining
      ws.send(JSON.stringify({
        type: 'join',
        room_id: 'room-1',
        peer_id: crypto.randomUUID()
      }))

      // grab camera and mic
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      document.getElementById('local').srcObject = stream

      // add tracks to PeerConnection
      stream.getTracks().forEach(track => pc.addTrack(track, stream))

      // create and send offer
      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)
      ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }))
    }
  </script>
</body>

</html>
